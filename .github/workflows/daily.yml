name: Build and deploy (every two days)

# Runs every two days, on every push to main that touches the site or its inputs,
# and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 3 */2 * *"   # 03:17 UTC on every second day of the month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "engine/**"
      - "site/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # a queued run starts from the latest commit, not the one that queued it
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build the engine
        run: cargo build --release --locked --manifest-path engine/Cargo.toml || cargo build --release --manifest-path engine/Cargo.toml

      - name: Check that offline builds are reproducible
        run: |
          ./engine/target/release/aliquome build --offline
          sha256sum site/data/sources.json site/data/datasets.json > /tmp/first.sha
          ./engine/target/release/aliquome build --offline
          sha256sum -c /tmp/first.sha

      - name: Fetch papers and benchmarks, check sources and links
        run: ./engine/target/release/aliquome build

      - name: Write the full catalogue into README.md and PAPERS.md
        run: node scripts/readme-catalog.mjs

      - name: Write one page per database, dataset, benchmark table and model, and the sitemap
        run: node scripts/static-pages.mjs

      - name: Commit the new data
        run: |
          git config user.name "akianfar"
          git config user.email "48835477+akianfar@users.noreply.github.com"
          git add site/data README.md PAPERS.md
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            # someone may have pushed while the build ran: replay on top and retry
            for attempt in 1 2 3 4 5; do
              # the data files are generated: on a conflict this newer build wins
              if git pull --rebase --quiet -X theirs && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            echo "Could not push the new data." && exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
