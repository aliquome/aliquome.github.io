name: Apply approved ranking changes

# A ranking proposal is an issue made from the "Ranking change" form, or opened
# by sync-submissions (label `ranking`). It takes effect only when a person with
# admin access to the repository adds the `approved` label; for a repository
# owned by an organization, that is an organization owner or a repository
# admin. Labels added by anyone else are ignored.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'ranking')
    runs-on: ubuntu-latest
    steps:
      - name: Check that the approver is a maintainer
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)
          echo "$SENDER has $PERMISSION access"
          if [ "$PERMISSION" = "admin" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.who.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.who.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install the TOML parser
        if: steps.who.outputs.ok == 'true'
        run: npm install --no-save --no-package-lock smol-toml@1.3.1

      - name: Check and apply the proposal
        id: apply
        if: steps.who.outputs.ok == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVER: ${{ github.event.sender.login }}
        run: node scripts/apply-ranking.mjs
        continue-on-error: true

      - name: Commit the new ranking
        if: steps.who.outputs.ok == 'true' && steps.apply.outcome == 'success'
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add data/rankings.toml
          git commit -m "rankings: apply #${{ github.event.issue.number }}"
          git push

      # a push made by this workflow does not start other workflows, so the
      # site build is started explicitly
      - name: Rebuild the site
        if: steps.who.outputs.ok == 'true' && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref "${{ github.event.repository.default_branch }}"

      - name: Report on the issue
        if: always() && steps.who.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          RESULT=$(cat .ranking-result 2>/dev/null || echo "error: the proposal could not be read")
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$NUMBER" --body "Applied to \`data/rankings.toml\`. The site is being rebuilt and will show the new ranking in a few minutes."
            gh issue close "$NUMBER" --reason completed
          else
            gh issue comment "$NUMBER" --body "The proposal was not applied: ${RESULT#error: }. Edit the issue and add the \`approved\` label again."
            gh issue edit "$NUMBER" --remove-label approved
          fi
