name: Tests

# End-to-end test of reader sign-in, suggestions, review and table updates,
# against local stand-ins for Supabase and GitHub (see tests/).
on:
  push:
    paths: ["scripts/**", "site/**", "tests/**", "data/benchmarks/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write a page for every address of the site
        run: node scripts/static-pages.mjs
      - name: Check every address, link and the sitemap
        run: node tests/paths.test.mjs
      - name: Install test dependencies
        run: npm install --prefix tests --no-audit --no-fund
      - name: Browse the site at its clean addresses
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/addresses.test.mjs
      - name: Run the end-to-end test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/submissions.test.mjs
