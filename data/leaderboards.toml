# Published results tables that the engine downloads every day.
# Each board is a CSV published by the benchmark maintainers. The site shows
# it unchanged, apart from choosing which columns to display.
#
#   url        raw CSV
#   model      column with the model name
#   kind       column with the model family (optional)
#   reference  column with an HTML <a> link to the paper (optional)
#   metric     main score column; the table is sorted by it
#   higher     true when a larger score is better
#   columns    extra score columns to show, as "CSV column = label"

[[board]]
id = "proteingym-zero-shot-substitutions"
title = "ProteinGym: zero-shot fitness prediction, substitutions"
field = "proteins"
task = "fitness"
dataset = "proteingym"
url = "https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/benchmarks/DMS_zero_shot/substitutions/Spearman/Summary_performance_DMS_substitutions_Spearman.csv"
source = "https://proteingym.org/benchmarks"
model = "Model_name"
kind = "Model type"
reference = "References"
metric = "Average_Spearman"
metric_label = "Spearman (mean)"
higher = true
columns = [
  "Function_Activity = Activity",
  "Function_Binding = Binding",
  "Function_Expression = Expression",
  "Function_OrganismalFitness = Organismal fitness",
  "Function_Stability = Stability",
]

