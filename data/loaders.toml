[[loader]]
targets = ["ds:pwc-tcga", "ds:pwc-bctcga"]
label = "GDC API"
docs = "https://docs.gdc.cancer.gov/API/Users_Guide/Getting_Started/"
code = '''
import requests, json

filters = {"op": "and", "content": [
  {"op": "in", "content": {"field": "cases.project.project_id", "value": ["TCGA-BRCA"]}},
  {"op": "in", "content": {"field": "data_type", "value": ["Gene Expression Quantification"]}},
  {"op": "in", "content": {"field": "access", "value": ["open"]}}]}
r = requests.get("https://api.gdc.cancer.gov/files", params={"filters": json.dumps(filters), "fields": "file_id,file_name", "size": "2000"}, timeout=60).json()
ids = [h["file_id"] for h in r["data"]["hits"]]
# then: gdc-client download <id> ...  or POST ids to https://api.gdc.cancer.gov/data
'''

