label = "COSMIC scripted download (free academic account)"
docs = "https://cancer.sanger.ac.uk/cosmic/download"
code = '''
# 1. ask for a signed URL with your COSMIC login
AUTH=$(printf '%s:%s' "$COSMIC_EMAIL" "$COSMIC_PASSWORD" | base64)
URL=$(curl -s -H "Authorization: Basic $AUTH" \
  "https://cancer.sanger.ac.uk/api/mono/products/v1/downloads/scripted?path=grch38/cosmic/v104/Cosmic_MutantCensus_Tsv_v104_GRCh38.tar&bucket=downloads" \
  | jq -r .url)
# 2. download the file
curl -L -o Cosmic_MutantCensus_v104.tar "$URL"
'''

