# Approved ranking changes for the benchmark tables in data/benchmarks/.
#
# Do not edit by hand unless you are a maintainer: proposals come in as
# "Ranking change" issues, and the workflow .github/workflows/rankings.yml
# writes them here when the repository owner adds the `approved` label.
#
# One [[table]] block per table; the newest approval replaces the previous one.
#   id        table id (the part after #benchmarks/ in the address)
#   metric    the metric the ranking uses
#   higher    true when a larger value is better
#   exclude   models taken out of the ranking (say why in `note`)
#   note      the reason, shown under the table
#   approved  issue number, maintainer and date, filled in by the workflow
#   [[table.add]]  a result published after the snapshot:
#                  model, paper, url (https), code (optional), date, values = { "metric" = number }
