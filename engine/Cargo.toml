[package]
name = "atlas-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Builds the data files of the Bioinformatics Data Atlas site: sources, versions, datasets, papers and source status."

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
ureq = "2"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4.35", default-features = false, features = ["now", "std"] }

[profile.release]
opt-level = 2
strip = true
