# Research fields shown on the site.
# `base` is the nucleotide colour family used for the field (A, C, G or T).
# `query` is a Europe PMC search expression; the engine adds `AND OPEN_ACCESS:y`.
# `shape` picks the family of the generated 3D figure.

[[field]]
id = "genomes"
label = "Genomes and annotation"
base = "A"
shape = "helix"
query = "(TITLE:\"genome assembly\" OR TITLE:\"reference genome\" OR TITLE:\"pangenome\" OR TITLE:\"genome annotation\")"

[[field]]
id = "variants"
label = "Variants and population genetics"
base = "T"
shape = "variant"
query = "(TITLE:\"genetic variation\" OR TITLE:\"variant calling\" OR TITLE:\"genome-wide association\" OR TITLE:\"population genomics\")"

[[field]]
id = "cancer"
label = "Cancer genomics"
base = "T"
shape = "tumour"
query = "(TITLE:\"cancer genome\" OR TITLE:\"pan-cancer\" OR TITLE:\"tumor heterogeneity\" OR TITLE:\"cancer genomics\")"

[[field]]
id = "expression"
label = "Expression and single-cell"
base = "G"
shape = "cells"
query = "(TITLE:\"single-cell\" OR TITLE:\"spatial transcriptomics\" OR TITLE:\"RNA-seq\")"

[[field]]
id = "proteins"
label = "Proteins and structures"
base = "C"
shape = "fold"
query = "(TITLE:\"protein structure prediction\" OR TITLE:\"protein language model\" OR TITLE:\"protein design\" OR TITLE:\"protein structure\")"

[[field]]
id = "pathways"
label = "Pathways, networks and ontologies"
base = "A"
shape = "network"
query = "(TITLE:\"protein-protein interaction\" OR TITLE:\"pathway analysis\" OR TITLE:\"gene ontology\" OR TITLE:\"knowledge graph\")"

[[field]]
id = "chemistry"
label = "Chemistry and drug discovery"
base = "G"
shape = "molecule"
query = "(TITLE:\"drug discovery\" OR TITLE:\"molecular docking\" OR TITLE:\"molecular generation\" OR TITLE:\"virtual screening\")"

[[field]]
id = "regulation"
label = "Epigenomics and regulation"
base = "C"
shape = "chromatin"
query = "(TITLE:\"chromatin accessibility\" OR TITLE:\"epigenome\" OR TITLE:\"transcription factor binding\" OR TITLE:\"DNA methylation\")"

[[field]]
id = "rna"
label = "RNA"
base = "T"
shape = "hairpin"
query = "(TITLE:\"non-coding RNA\" OR TITLE:\"RNA structure\" OR TITLE:\"microRNA\" OR TITLE:\"RNA modification\")"

[[field]]
id = "microbiome"
label = "Microbiome and metagenomics"
base = "A"
shape = "microbes"
query = "(TITLE:\"metagenomics\" OR TITLE:\"microbiome\" OR TITLE:\"metagenome-assembled\")"

[[field]]
id = "benchmarks"
label = "Benchmarks and machine learning"
base = "G"
shape = "bars"
query = "(TITLE:\"benchmark\" AND (TITLE:\"genomics\" OR TITLE:\"protein\" OR TITLE:\"single-cell\" OR TITLE:\"bioinformatics\" OR TITLE:\"biology\"))"

